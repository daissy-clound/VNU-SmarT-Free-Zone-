<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17634c"/>
      <stop offset="1" stop-color="#0f3f31"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="520" cy="90" r="160" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="760" r="200" fill="#ffffff" opacity="0.04"/>

  <text x="48" y="78" fill="#a7d7c0" font-size="18" font-weight="600" letter-spacing="3">UET HOÀ LẠC · ĐHQGHN</text>
  <text x="48" y="150" fill="#ffffff" font-size="50" font-weight="800">Toà nhà</text>
  <text x="48" y="210" fill="#ffffff" font-size="50" font-weight="800">không khói thuốc</text>
  <text x="48" y="256" fill="#d6efe3" font-size="20">Kể cả thuốc lá điện tử và thuốc lá nung nóng.</text>

  <g transform="translate(48 300)">
    <rect width="504" height="132" rx="18" fill="#ffffff" opacity="0.1"/>
    <circle cx="56" cy="66" r="34" fill="#f59e0b"/>
    <text x="56" y="78" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="800">!</text>
    <text x="110" y="56" fill="#ffffff" font-size="22" font-weight="700">Khói thuốc thụ động</text>
    <text x="110" y="86" fill="#d6efe3" font-size="17">bám lại trên tường, rèm, ghế</text>
    <text x="110" y="110" fill="#d6efe3" font-size="17">và tiếp tục gây hại người xung quanh.</text>
  </g>

  <g transform="translate(48 456)">
    <rect width="504" height="196" rx="18" fill="#ffffff"/>
    <text x="28" y="44" fill="#17634c" font-size="22" font-weight="800">Thấy khói thuốc? Báo ẩn danh</text>
    <g fill="#0f3f31" font-size="18">
      <circle cx="44" cy="84" r="16" fill="#17634c"/><text x="44" y="90" text-anchor="middle" fill="#fff" font-weight="700">1</text>
      <text x="72" y="90">Quét mã QR dán tại khu vực</text>
      <circle cx="44" cy="124" r="16" fill="#17634c"/><text x="44" y="130" text-anchor="middle" fill="#fff" font-weight="700">2</text>
      <text x="72" y="130">Chọn điều bạn thấy</text>
      <circle cx="44" cy="164" r="16" fill="#17634c"/><text x="44" y="170" text-anchor="middle" fill="#fff" font-weight="700">3</text>
      <text x="72" y="170">Gửi, giữ mã để tra cứu</text>
    </g>
    <g transform="translate(386 64)">
      <rect width="96" height="96" rx="8" fill="#ffffff" stroke="#17634c" stroke-width="3"/>
      <g fill="#17634c">
        <rect x="10" y="10" width="26" height="26"/><rect x="60" y="10" width="26" height="26"/><rect x="10" y="60" width="26" height="26"/>
        <rect x="44" y="44" width="10" height="10"/><rect x="62" y="62" width="10" height="10"/><rect x="76" y="76" width="10" height="10"/>
        <rect x="44" y="20" width="8" height="8"/><rect x="20" y="44" width="8" height="8"/><rect x="66" y="46" width="8" height="8"/>
      </g>
      <g fill="#ffffff"><rect x="16" y="16" width="14" height="14"/><rect x="66" y="16" width="14" height="14"/><rect x="16" y="66" width="14" height="14"/></g>
    </g>
    <text x="28" y="186" fill="#64748b" font-size="13">Không cần tên, không cần đăng nhập.</text>
  </g>

  <text x="48" y="712" fill="#ffffff" font-size="20" font-weight="700">Muốn bỏ thuốc? Gọi 1800 6606</text>
  <text x="48" y="740" fill="#a7d7c0" font-size="16">Tổng đài tư vấn cai thuốc lá miễn phí</text>
  <text x="552" y="768" text-anchor="end" fill="#7fb69c" font-size="13">VNU SmarT-Free Zone</text>
</svg>
