<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-label="Wireframe Sơ đồ tầng"><style>text{font-family:Arial,sans-serif}</style><rect width="1280" height="900" fill="#f3f6f4"/><rect width="210" height="900" fill="#e1e9e3"/><text x="24" y="44" font-size="16" fill="#3a4e44">VNU SmarT-Free Zone</text><text x="28" y="130" font-size="16" fill="#3a4e44">Tổng quan</text><text x="28" y="188" font-size="16" fill="#3a4e44">Sơ đồ tầng</text><text x="28" y="246" font-size="16" fill="#3a4e44">Phiếu</text><text x="28" y="304" font-size="16" fill="#3a4e44">Phân tích</text><text x="28" y="362" font-size="16" fill="#3a4e44">Ca trực</text><text x="22" y="824" font-size="14" fill="#3a4e44">Menu theo vai trò</text><text x="242" y="44" font-size="26" fill="#3a4e44">Sơ đồ tầng</text><text x="242" y="78" font-size="14" fill="#3a4e44">D2 · 16/10/2026 · Bản phác thảo để thống nhất luồng</text><rect x="242" y="112" width="1004" height="86" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="142" font-size="18" fill="#3a4e44">Bộ chọn</text><text x="260" y="174" font-size="14" fill="#6c7c73">Toà A / B     Tầng 1–6     Chú giải màu + hiện diện</text><rect x="242" y="224" width="670" height="460" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="254" font-size="18" fill="#3a4e44">SVG · viewBox 1000 × 560</text><text x="260" y="286" font-size="14" fill="#6c7c73">Khu vực chung      |      Phòng ở      |      Khu vực chung</text><text x="260" y="313" font-size="14" fill="#6c7c73">Thang Tây   ===== HÀNH LANG =====   Thang Đông</text><text x="260" y="340" font-size="14" fill="#6c7c73">● sensor-B5-CTD      ▣ QR-B5-CTD      ? presence-B5-CTD</text><text x="260" y="367" font-size="14" fill="#6c7c73">Mỗi cảm biến / QR có id riêng; đổi màu theo trạng thái.</text><text x="260" y="394" font-size="14" fill="#6c7c73">Bấm / Enter vào điểm → thông tin khu vực.</text><text x="260" y="421" font-size="14" fill="#6c7c73">Hiện diện: Có người / Không còn ai / Không rõ.</text><text x="260" y="448" font-size="14" fill="#6c7c73">Toạ độ tạm; chờ danh mục chính thức của A.</text><rect x="936" y="224" width="310" height="460" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="954" y="254" font-size="18" fill="#3a4e44">Thông tin khu vực</text><text x="954" y="286" font-size="14" fill="#6c7c73">Mã, tên, toà, tầng</text><text x="954" y="313" font-size="14" fill="#6c7c73">Mã cảm biến / QR</text><text x="954" y="340" font-size="14" fill="#6c7c73">Trạng thái cảm biến</text><text x="954" y="367" font-size="14" fill="#6c7c73">Trạng thái hiện diện</text><text x="954" y="394" font-size="14" fill="#6c7c73">→ Xem danh sách phiếu</text><text x="242" y="870" font-size="14" fill="#3a4e44">Nghi vấn cần người xác minh · dữ liệu KTX giả lập</text></svg>