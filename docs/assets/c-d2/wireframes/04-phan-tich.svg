<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-label="Wireframe Phân tích"><style>text{font-family:Arial,sans-serif}</style><rect width="1280" height="900" fill="#f3f6f4"/><rect width="210" height="900" fill="#e1e9e3"/><text x="24" y="44" font-size="16" fill="#3a4e44">VNU SmarT-Free Zone</text><text x="28" y="130" font-size="16" fill="#3a4e44">Tổng quan</text><text x="28" y="188" font-size="16" fill="#3a4e44">Sơ đồ tầng</text><text x="28" y="246" font-size="16" fill="#3a4e44">Phiếu</text><text x="28" y="304" font-size="16" fill="#3a4e44">Phân tích</text><text x="28" y="362" font-size="16" fill="#3a4e44">Ca trực</text><text x="22" y="824" font-size="14" fill="#3a4e44">Menu theo vai trò</text><text x="242" y="44" font-size="26" fill="#3a4e44">Phân tích</text><text x="242" y="78" font-size="14" fill="#3a4e44">D2 · 16/10/2026 · Bản phác thảo để thống nhất luồng</text><rect x="242" y="112" width="1004" height="82" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="142" font-size="18" fill="#3a4e44">Phạm vi D2: khung trang</text><text x="260" y="174" font-size="14" fill="#6c7c73">Chưa có dữ liệu; không tạo số liệu đánh giá giả. Bàn giao E, D.</text><rect x="242" y="220" width="490" height="250" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="250" font-size="18" fill="#3a4e44">Bản đồ nhiệt</text><text x="260" y="282" font-size="14" fill="#6c7c73">Tách lớp nghi vấn / đã xác nhận</text><text x="260" y="309" font-size="14" fill="#6c7c73">Bộ lọc toà, tuần, khu vực</text><text x="260" y="336" font-size="14" fill="#6c7c73">Nguồn API thống kê của A</text><rect x="756" y="220" width="490" height="250" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="774" y="250" font-size="18" fill="#3a4e44">Dự báo &amp; tuần tra</text><text x="774" y="282" font-size="14" fill="#6c7c73">Top 10 khu vực × khung giờ</text><text x="774" y="309" font-size="14" fill="#6c7c73">Lịch tuần tra gợi ý từ D</text><text x="774" y="336" font-size="14" fill="#6c7c73">Ghi rõ dựa trên dữ liệu mô phỏng</text><rect x="242" y="496" width="490" height="250" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="526" font-size="18" fill="#3a4e44">Minh bạch thuật toán</text><text x="260" y="558" font-size="14" fill="#6c7c73">Ma trận nhầm lẫn; precision / recall</text><text x="260" y="585" font-size="14" fill="#6c7c73">Số sự kiện, tập kiểm tra từ E</text><text x="260" y="612" font-size="14" fill="#6c7c73">Giới hạn cảm biến hiện diện</text><rect x="756" y="496" width="490" height="250" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="774" y="526" font-size="18" fill="#3a4e44">Báo cáo tuần</text><text x="774" y="558" font-size="14" fill="#6c7c73">Tổng hợp số liệu đã kiểm chứng</text><text x="774" y="585" font-size="14" fill="#6c7c73">Nguồn số liệu và thời gian cập nhật</text><text x="242" y="870" font-size="14" fill="#3a4e44">Nghi vấn cần người xác minh · dữ liệu KTX giả lập</text></svg>