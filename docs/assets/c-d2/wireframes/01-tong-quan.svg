<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-label="Wireframe Tổng quan"><style>text{font-family:Arial,sans-serif}</style><rect width="1280" height="900" fill="#f3f6f4"/><rect width="210" height="900" fill="#e1e9e3"/><text x="24" y="44" font-size="16" fill="#3a4e44">VNU SmarT-Free Zone</text><text x="28" y="130" font-size="16" fill="#3a4e44">Tổng quan</text><text x="28" y="188" font-size="16" fill="#3a4e44">Sơ đồ tầng</text><text x="28" y="246" font-size="16" fill="#3a4e44">Phiếu</text><text x="28" y="304" font-size="16" fill="#3a4e44">Phân tích</text><text x="28" y="362" font-size="16" fill="#3a4e44">Ca trực</text><text x="22" y="824" font-size="14" fill="#3a4e44">Menu theo vai trò</text><text x="242" y="44" font-size="26" fill="#3a4e44">Tổng quan</text><text x="242" y="78" font-size="14" fill="#3a4e44">D2 · 16/10/2026 · Bản phác thảo để thống nhất luồng</text><rect x="242" y="112" width="234" height="120" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="142" font-size="18" fill="#3a4e44">Phiếu đang xử lý</text><text x="260" y="174" font-size="14" fill="#6c7c73">Số phiếu mở từ API</text><rect x="492" y="112" width="234" height="120" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="510" y="142" font-size="18" fill="#3a4e44">Quá hạn</text><text x="510" y="174" font-size="14" fill="#6c7c73">Theo due_at của máy chủ</text><rect x="742" y="112" width="234" height="120" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="760" y="142" font-size="18" fill="#3a4e44">Đã xử lý</text><text x="760" y="174" font-size="14" fill="#6c7c73">Không gọi là đã xác nhận</text><rect x="992" y="112" width="254" height="120" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="1010" y="142" font-size="18" fill="#3a4e44">Khu vực</text><text x="1010" y="174" font-size="14" fill="#6c7c73">20 QR · 10 cảm biến</text><rect x="242" y="258" width="656" height="350" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="288" font-size="18" fill="#3a4e44">Phiếu mới nhất → Xem tất cả</text><text x="260" y="320" font-size="14" fill="#6c7c73">Mã | Khu vực | Nguồn | Ưu tiên | Trạng thái | Hạn</text><text x="260" y="347" font-size="14" fill="#6c7c73">Bấm mã → mở thông tin phiếu</text><text x="260" y="374" font-size="14" fill="#6c7c73">Phiếu mới / cập nhật → tự đồng bộ</text><text x="260" y="401" font-size="14" fill="#6c7c73">Mất mạng → giữ dữ liệu cũ + cảnh báo + Thử lại</text><rect x="922" y="258" width="324" height="350" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="940" y="288" font-size="18" fill="#3a4e44">Khung infographic</text><text x="940" y="320" font-size="14" fill="#6c7c73">Ảnh + tiêu đề từ B</text><text x="940" y="347" font-size="14" fill="#6c7c73">Toà / khu vực áp dụng</text><text x="940" y="374" font-size="14" fill="#6c7c73">Thời gian hiển thị</text><text x="940" y="401" font-size="14" fill="#6c7c73">Chỉ BQL có quyền đăng (D6)</text><rect x="242" y="636" width="1004" height="150" rx="8" fill="white" stroke="#99aaa1" stroke-dasharray="5 3"/><text x="260" y="666" font-size="18" fill="#3a4e44">Quy trình 6 trạng thái</text><text x="260" y="698" font-size="14" fill="#6c7c73">Tiếp nhận → Phân công → Xác minh → Xử lý → Phản hồi → Đóng</text><text x="260" y="725" font-size="14" fill="#6c7c73">KPI tính từ danh sách API; phân tích sâu nối ở các ngày sau.</text><text x="242" y="870" font-size="14" fill="#3a4e44">Nghi vấn cần người xác minh · dữ liệu KTX giả lập</text></svg>